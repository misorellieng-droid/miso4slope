server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Atrás do proxy do EasyPanel o Nginx recebe HTTP puro: redirecionamentos
    # relativos evitam sair como http://...:80 e quebrar o HTTPS.
    absolute_redirect off;

    # Endereço antigo: slope.miso4apps.com.br/x -> miso4apps.com.br/slope/x
    if ($host = slope.miso4apps.com.br) {
        return 301 https://miso4apps.com.br/slope$request_uri;
    }

    # O app mora em /slope/ (build copiado para html/slope, vite base "/slope/").
    location = /slope {
        return 301 /slope/;
    }

    # Arquivos com hash: cache longo. Sem fallback: arquivo inexistente dá 404
    # em vez de devolver HTML (evita tela branca depois de um deploy).
    location ^~ /slope/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: rota que não é arquivo real cai no index.html do slope.
    location /slope/ {
        try_files $uri $uri/ /slope/index.html;
        add_header Cache-Control "no-cache";
    }

    # Se o proxy repassar o pedido SEM o prefixo /slope, ele é recolocado aqui.
    location / {
        rewrite ^/(.*)$ /slope/$1 last;
    }
}
