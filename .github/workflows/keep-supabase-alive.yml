name: Manter Supabase ativo (miso4slope)

# Projetos Supabase no plano free pausam depois de ~7 dias sem atividade de
# API. Esse workflow faz uma leitura simples e barata (health check do Auth)
# todo dia, só pra contar como atividade e evitar a pausa automática.
#
# A anon key abaixo NÃO é um segredo — é a mesma chave pública já embutida
# no bundle JS servido pelo app em produção (protegida por RLS, não por
# sigilo), então não há problema em ela estar em texto puro num workflow
# público.

on:
  schedule:
    - cron: '1 13 * * *' # todo dia às 13:01 UTC
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions do GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health
        env:
          SUPABASE_URL: https://ufykzvghxqahohlxpmsk.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmeWt6dmdoeHFhaG9obHhwbXNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNTMzMjksImV4cCI6MjA5ODYyOTMyOX0.LImCpFip9s9QgMOzAnkFajdoov0QX0IXWkNER1KGjt0
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" \
            "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON_KEY"
